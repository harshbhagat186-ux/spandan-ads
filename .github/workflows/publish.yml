name: Publish daily batch

# A session pushes a day's files to a branch named upload/YYYY-MM-DD (files under YYYY-MM-DD/).
# This turns them into the release tagged YYYY-MM-DD, removes the branch, and refreshes index.json.
on:
  push:
    branches: ["upload/**"]

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: batch
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          day="${BRANCH#upload/}"
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad branch $BRANCH"; exit 1; }
          src="batch/$day"
          files=()
          # Video poster frames (<name>.thumb.jpg) are made by tools/publish_day.sh.
          for f in "$src"/*.png "$src"/*.jpg "$src"/*.jpeg "$src"/*.webp "$src"/*.mp4; do
            [ -e "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "no media in $src"; exit 1; }
          if gh release view "$day" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$day" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$day" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Spandan ads $day" \
              --notes "Daily batch for $day: posters 1080x1350, reels 1080x1920." --latest=false
          fi
          git -C batch push origin --delete "$BRANCH"
      - name: Refresh index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: site
        run: |
          python3 tools/make_index.py "$GITHUB_REPOSITORY" > index.json
          if git diff --quiet -I '"updated"' -- index.json; then exit 0; fi
          git config user.name "spandan-bot"
          git config user.email "spandan-bot@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git pull --rebase origin main
          git push origin HEAD:main
