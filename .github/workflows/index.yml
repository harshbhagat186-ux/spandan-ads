name: Update index.json

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build index.json from releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/make_index.py "${{ github.repository }}" > index.json
      - name: Commit if changed
        run: |
          if git diff --quiet -I '"updated"' -- index.json; then
            echo "index.json unchanged"; exit 0
          fi
          git config user.name "spandan-bot"
          git config user.email "spandan-bot@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git pull --rebase origin main
          git push origin HEAD:main
