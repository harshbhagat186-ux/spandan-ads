name: Build APK

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle", "settings.gradle", "gradle.properties", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks";
          else echo "Missing KEYSTORE_B64 secret" >&2; exit 1; fi
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -Prepo=${{ github.repository }}
      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SpandanAds.apk
          notes="Latest Spandan Ads app. Install: download SpandanAds.apk on the phone and open it.
          versionCode: ${{ github.run_number }}"
          if gh release view app >/dev/null 2>&1; then
            gh release upload app SpandanAds.apk --clobber
            gh release edit app --notes "$notes"
          else
            gh release create app SpandanAds.apk --title "Spandan Ads app" --notes "$notes" --latest
          fi
          gh workflow run index.yml
      - uses: actions/upload-artifact@v4
        with:
          name: SpandanAds-apk
          path: SpandanAds.apk
